name: Bug 反馈
description: 有东西坏了或行为不对，用这个
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        填之前先确认两件事：**已升级到最新版本**，以及**搜过现有 issue**。

        ⚠️ 贴日志前请删掉数据库密码、API Key、真实姓名等隐私信息。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 一句话说清现象。比如「到期日设为今天的订阅，卡片显示灰色而不是橙色」。
      placeholder: 我点了什么，看到了什么不应该出现的结果
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
      description: 按你的理解，正确行为应该是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，别跳步。能稳定复现的 bug 才会被修。
      placeholder: |
        1. 打开看板页
        2. 新建一条订阅，到期日填今天
        3. 保存后看卡片颜色
        4. ...
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 你怎么跑的
      options:
        - pnpm dev 本地开发模式
        - docker compose 起 MySQL + 自建后端
        - 自备 MySQL 实例
        - 已部署到服务器
        - 其他（在下方说明）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 填 tag 名（如 v0.1.0）或 `git rev-parse --short HEAD` 的短哈希。写「最新」等于没写。
      placeholder: v0.1.0 或 a1b2c3d
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息 / 截图
      description: 浏览器控制台报错、后端终端日志、界面截图，能给就给。截图可以直接拖进来。
      render: shell
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统 + 浏览器（如果是界面问题）+ Node 版本
      placeholder: macOS 15 / Chrome 132 / Node 24.12
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我贴出的内容不含密码、密钥等敏感信息
          required: true
