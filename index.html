<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exp-track · 订阅到期追踪</title>

    <meta name="keywords" content="订阅管理,订阅到期提醒,订阅追踪,续费提醒,包年包月,到期时间轴,本地优先,exp-track">
    <meta name="author" content="exp-track">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="canonical" href="http://127.0.0.1:15173/">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="exp-track">
    <meta property="og:title" content="exp-track · 订阅到期追踪">
    <meta property="og:description" content="本地优先的订阅到期追踪与可视化工具，集中管理包年/包月订阅的到期时间与价格，帮你掌握哪些服务即将到期。">
    <meta property="og:locale" content="zh_CN">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="exp-track · 订阅到期追踪">
    <meta name="twitter:description" content="本地优先的订阅到期追踪与可视化工具，集中管理包年/包月订阅的到期时间与价格。">
    <script>
      (function () {
        const STORAGE_KEY = 'exp-track-theme';
        const saved = localStorage.getItem(STORAGE_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light');

        const SCALE_KEY = 'exp-track-ui-scale';
        const scaleRaw = localStorage.getItem(SCALE_KEY);
        const scaleNum = scaleRaw === null ? NaN : Number(scaleRaw);
        // 合法档位须与 src/stores/settings.ts 的 UI_SCALE_PRESETS 保持一致
        if (scaleNum === 0.9 || scaleNum === 1.0 || scaleNum === 1.1 || scaleNum === 1.25) {
          document.documentElement.style.setProperty('--ui-scale', String(scaleNum));
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 640px; margin: 80px auto; padding: 0 24px; font-family: system-ui, sans-serif; line-height: 1.6; color: #1f2937;">
        <h1>exp-track · 订阅到期追踪</h1>
        <p>exp-track 是一款本地优先的订阅到期追踪与可视化工具，用于集中管理包年/包月订阅的到期时间、扣费周期与价格，帮助你掌握哪些服务即将到期，避免遗忘续费或持续自动扣费造成的浪费。</p>
        <p>本应用需要启用 JavaScript 才能使用。请在浏览器设置中开启 JavaScript 后重新加载页面。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
